; MapMirror display firmware — ST7789 240x280 + ESP32, Wi-Fi and BLE receivers.
; Pick the env that matches your board:  pio run -e esp32s3 -t upload

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi   ; N16R8 / N8R8 modules; use qio_qspi for N4R2
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM

[env:esp32]
board = esp32dev
board_build.partitions = huge_app.csv       ; Wi-Fi + BLE + GFX needs > 1.2 MB

[env:xiao_c3]
board = seeed_xiao_esp32c3
board_build.partitions = huge_app.csv
